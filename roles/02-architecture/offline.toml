# 离线演练示例数据：不调用模型时用于验证编排链路与产物结构。

summary = "已确定 4 模块分层架构（存储 / 索引 / 检索 / CLI），并拆解为 6 个可独立实现的任务。"
verdict = "n/a"

decisions = [
  "采用单包结构：storage 负责文件读写，index 负责索引重建，search 负责匹配，cli 负责参数与输出",
  "笔记元信息使用文件头部的键值段落而非 YAML，减少解析复杂度并保持零依赖",
  "索引只做加速缓存，任何查询都可退化为直接扫描笔记目录",
  "检索先做大小写归一化的子串匹配，不引入分词；在 ADR 中记录该取舍",
]

risks = [
  "离线演练产物为示例数据，接入模型后需按真实需求重新设计",
  "文件头段落格式对正文中的同名行敏感，需要在开发阶段用结束标记规避",
]

[handoff]
ready = true
notes = "模块职责、接口签名、数据格式与任务拆解均已定义，可进入开发。"

[[artifacts]]
path = "architecture.md"
content = """# 架构说明（离线演练示例）

> 本文件由 `roles/02-architecture/offline.toml` 生成，用于验证编排链路；接入模型后会替换为真实设计。

## 1. 设计目标

- 满足 FR-1 至 FR-8，且不引入任何第三方依赖。
- 任何查询在索引缺失或损坏时都能退化为直接扫描，保证可用性优先。

## 2. 目录结构

```
notes-cli/
├─ notes_cli/
│  ├─ __init__.py
│  ├─ storage.py      # 笔记文件读写与 id 生成
│  ├─ index.py        # 索引构建、加载、失效检测
│  ├─ search.py       # 关键词 / 标签匹配与摘要
│  └─ cli.py          # 命令行解析与输出格式化
├─ tests/
│  └─ test_notes_cli.py
└─ README.md
```

## 3. 模块职责

| 模块 | 职责 | 不负责 |
| --- | --- | --- |
| storage | 创建/读取/删除笔记，生成唯一 id，维护文件头元信息 | 检索、索引、输出格式 |
| index | 扫描目录构建 `index.json`，检测索引过期 | 直接修改笔记正文 |
| search | 关键词与标签匹配，生成摘要片段 | 文件落盘、参数解析 |
| cli | 解析参数、组装调用、输出文本或 JSON、设置退出码 | 业务规则实现 |

## 4. 数据模型

笔记文件 `notes/<id>.md`：

```
title: 标题
tags: python, 工具
created: 2026-11-09T10:00:00
----
正文内容……
```

- `id`：`YYYYMMDDHHMMSS-<标题拼音或英文摘要截断>`，冲突时追加 `-2`、`-3`。
- 文件头以单独一行 `----` 结束，正文中出现的同名行不受影响。

索引 `notes/index.json`：

```json
{
  "version": 1,
  "generated_at": "2026-11-09T10:05:00",
  "notes": [
    {"id": "20261109100000-demo", "title": "示例", "tags": ["python"], "created": "2026-11-09T10:00:00", "mtime": 1760000000}
  ]
}
```

## 5. 接口定义

| 接口 | 签名 | 行为 |
| --- | --- | --- |
| storage.create | `create(title: str, body: str, tags: list[str]) -> Note` | 生成 id 并落盘；返回元信息 |
| storage.delete | `delete(note_id: str) -> bool` | 不存在返回 False，不产生副作用 |
| index.rebuild | `rebuild(notes_dir: Path) -> Index` | 全量扫描，覆盖写 `index.json` |
| index.load | `load(notes_dir: Path) -> Index \\| None` | 索引缺失或版本不符时返回 None |
| search.by_keyword | `by_keyword(notes: list[Note], keyword: str) -> list[Hit]` | 大小写不敏感子串匹配，返回摘要 |
| search.by_tags | `by_tags(notes: list[Note], tags: list[str]) -> list[Note]` | 全部标签同时满足 |
| cli.main | `main(argv: list[str]) -> int` | 返回退出码，输出遵循 `--json` 开关 |

## 6. 错误处理

- 参数错误：退出码 2，stderr 输出用法提示。
- 笔记不存在：退出码 3，stderr 输出 id。
- 文件系统错误：退出码 1，stderr 输出路径与原因。
- `--json` 模式下，成功结果写 stdout，错误信息仍写 stderr，保证 stdout 可解析。

## 7. 扩展点

- 检索策略可在 `search.py` 内部替换，不影响 CLI 契约。
- 索引版本号已预留，后续字段扩展通过版本迁移处理。
"""

[[artifacts]]
path = "design_decisions.md"
content = """# 关键决策记录（离线演练示例）

## ADR-1 仅使用 Python 标准库

- 背景：需求要求 Windows 直接运行、不依赖 Docker、避免付费与强制联网审批。
- 选项：A 标准库；B 引入 click/rich 等 CLI 库；C 引入全文检索库。
- 选择：A。
- 理由：安装成本为零，交付物可直接复制运行；当前需求规模不需要富交互与复杂检索。
- 影响：参数解析需要 argparse 手写，输出格式需自行控制；后续若交互复杂化再评估。

## ADR-2 笔记元信息用文件头键值段落

- 背景：需要在不引入 YAML 解析依赖的前提下保存标题、标签、创建时间。
- 选项：A 文件头键值段 + `----` 结束符；B 文件名编码元信息；C 独立 JSON 元数据文件。
- 选择：A。
- 理由：单文件自描述，正文与元信息不分离，便于 Git 阅读；结束符避免正文误判。
- 影响：解析器需处理缺失字段与异常格式，开发阶段必须覆盖边界用例。

## ADR-3 索引为可重建缓存

- 背景：索引能加速列表与标签查询，但可能损坏或缺失。
- 选项：A 索引作为唯一数据源；B 索引为缓存，缺失时退化为扫描。
- 选择：B。
- 理由：用户可直接手改 Markdown，索引必须可重建，避免数据不可用。
- 影响：查询路径需同时支持索引与扫描，测试需覆盖"索引缺失"场景（对应 AC-9）。

## ADR-4 检索不做分词

- 背景：需求只要求关键词与标签检索，未确认中文分词需求。
- 选项：A 大小写不敏感子串匹配；B 引入轻量分词；C 全文检索引擎。
- 选择：A。
- 理由：零依赖约束下 B/C 成本过高；子串匹配对短笔记场景足够。
- 影响：同义词可能漏检，已在需求风险中登记，后续可按需替换 search 模块。
"""

