| T-6 | 自测与文档 | `tests/test_notes_cli.py`、`README.md` | T-5 | 全部 AC 有对应测试或检查记录 |

## 实施顺序

1. T-1 → T-2：先把"能写入、能读回"打通。
2. T-3：索引在写入稳定后再做，避免反复迁移格式。
3. T-4 → T-5：检索与 CLI 输出一起联调，确保 `--json` 契约稳定。
4. T-6：补测试与使用说明，作为交接质量的证据。

## 风险与回退

- 若文件头解析在 T-2 阶段出现歧义，允许改为"首个空行分隔"，但必须同步更新 architecture.md 的数据模型并在决策中记录。
- 若 T-4 检索性能不达标，先启用索引过滤，再评估是否引入分词。
"""
