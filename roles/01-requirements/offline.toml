[[artifacts]]
path = "requirements.md"
content = """# 需求说明（离线演练示例）

> 本文件由 `roles/01-requirements/offline.toml` 生成，用于验证多智能体编排与产物结构；接入模型后会替换为真实分析内容。

## 1. 背景与目标

- 团队目标：{{goal}}
- 运行标识：{{run_id}}
- 生成日期：{{date}}

目标是把「本地 Markdown 笔记管理」做成一个零依赖、可离线运行的小工具：能快速记录、检索、删除笔记，并能生成可读的索引。

## 2. 目标用户与场景

### 2.1 目标用户

- 需要在本地快速记录想法的个人用户
- 不希望依赖云服务、账号体系或图形界面的轻量使用者
- 需要把笔记纳入版本管理（Git）的开发者

### 2.2 核心场景

| 场景 | 触发条件 | 期望结果 |
| --- | --- | --- |
| S-1 新建笔记 | 用户有一条新想法 | 命令执行后生成一条 Markdown 笔记，包含标题、正文、标签与创建时间 |
| S-2 检索笔记 | 用户记得关键词或标签 | 列出匹配笔记的标题、标签、摘要与文件路径 |
| S-3 删除笔记 | 用户确认某条笔记不再需要 | 删除对应文件并从索引移除，输出被删除的笔记标识 |
| S-4 生成索引 | 用户希望总览全部笔记 | 生成按标签分组的索引文件，可直接阅读或被其他工具解析 |

## 3. 功能需求

| 编号 | 需求 | 优先级 | 说明 |
| --- | --- | --- | --- |
| FR-1 | 新建笔记 | 必须 | 接收标题、正文、可选标签，落盘为 `notes/<id>.md` |
| FR-2 | 按关键词检索 | 必须 | 匹配标题与正文，输出命中位置与摘要 |
| FR-3 | 按标签检索 | 必须 | 标签匹配不区分大小写，支持多标签同时满足 |
| FR-4 | 删除笔记 | 必须 | 按 id 删除；不存在时返回非零退出码与明确提示 |
| FR-5 | 重建索引 | 必须 | 扫描笔记目录生成 `index.json`，包含 id、标题、标签、修改时间 |
| FR-6 | 列表输出 | 应该 | 无参数时按修改时间倒序列出全部笔记摘要 |
| FR-7 | JSON 输出模式 | 应该 | 提供 `--json` 让外部程序直接解析结果 |
| FR-8 | 笔记 id 规则 | 必须 | 使用创建时间 + 标题摘要，冲突时追加序号，保证唯一且可读 |

## 4. 非功能需求

- 运行环境：Python 3.11+，仅使用标准库，Windows / macOS / Linux 均可运行。
- 性能：笔记总量不超过 1000 条时，单次命令在 1 秒内完成。
- 数据可读性：笔记为纯文本 Markdown，元信息使用 YAML front matter 或固定段落，至少被一种通用方式解析。
- 可恢复性：索引损坏可直接删除重建，不影响笔记正文。
- 错误处理：所有失败路径返回非零退出码，并在 stderr 给出可操作的提示。

## 5. 明确不做

- 图形界面与富文本编辑
- 云同步、账号体系、多用户权限
- 全文检索引擎与向量检索
- 附件与图片管理

## 6. 假设与风险

- 假设：单机单用户使用，笔记规模不超过 1 万条。
- 假设：用户接受用命令行操作，不需要交互式确认（删除操作除外）。
- 风险：简单关键词匹配可能漏检同义词，是否引入分词由架构阶段决策。
- 风险：标签体系缺少约束，可能出现同义标签，需在索引中保留原始标签以便后续治理。
"""

[[artifacts]]
path = "acceptance_criteria.md"
content = """# 验收标准（离线演练示例）

> 每条标准都可被一条命令或一次检查验证，用于质量门禁判定。

| 编号 | 验收标准 | 验证方式 |
| --- | --- | --- |
| AC-1 | 执行新建命令后，笔记目录出现新的 Markdown 文件 | `ls notes/` 或 `dir notes` 检查文件数增加 |
| AC-2 | 新笔记包含标题、正文、标签与创建时间四个要素 | 打开生成的文件逐项检查 |
| AC-3 | 相同标题连续创建两次不会覆盖已有笔记 | 连续执行两次新建，确认生成两个不同 id 的文件 |
| AC-4 | 关键词检索能命中标题中的词并输出文件路径 | 用标题中的词检索，检查输出路径正确 |
| AC-5 | 关键词检索能命中正文中的词并给出一行上下文 | 用正文独有词检索，检查摘要包含该词 |
| AC-6 | 多标签检索只返回同时满足全部标签的笔记 | 构造三条不同标签笔记，执行多标签查询 |
| AC-7 | 删除存在的笔记后文件消失、索引同步移除 | 删除后检查文件与 `index.json` |
| AC-8 | 删除不存在的笔记返回非零退出码且不修改任何文件 | 检查退出码与目录快照 |
| AC-9 | 重建索引能在无索引状态下从笔记目录恢复 | 删除 `index.json` 后执行重建，索引内容与笔记一致 |
| AC-10 | `--json` 模式下 stdout 是可解析的 JSON，不含其他文字 | 用 `python -c "import json,sys;json.load(sys.stdin)"` 校验 |
"""
