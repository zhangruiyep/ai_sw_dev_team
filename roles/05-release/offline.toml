# 离线演练示例数据：不调用模型时用于验证编排链路与产物结构。

summary = "版本 v0.1.0 已完成交付准备：质量结论 pass，产物 4 份，附回滚与后续待办。"
verdict = "n/a"

decisions = [
  "版本号定为 v0.1.0：首次交付、无历史版本、能力范围符合 minor 初始定义",
  "交付形态为代码 + 文档 + 索引示例，不含二进制发布包",
  "回滚方式为保留上一份 notes 目录备份，索引可随时重建",
]

risks = [
  "离线演练中的版本清单为示例数据，真实 run_id 与 sha256 由编排器落盘结果生成",
]

[handoff]
ready = true
notes = "交付清单与版本记录已就绪，等待用户验收。"

[[artifacts]]
path = "release_notes.md"
content = """# 发布说明 v0.1.0（离线演练示例）

- 版本：v0.1.0
- 运行标识：{{run_id}}
- 生成日期：{{date}}
- 质量结论：pass（详见 quality/quality_report.md）

## 新增

- 笔记新建、列表、关键词/标签检索、删除、索引重建五类命令
- `--json` 输出模式，便于外部程序解析
- 文件头元信息格式（title / tags / created），正文以 `----` 分隔

## 变更

- 无（首次交付）

## 修复

- 无（首次交付）

## 已知问题

- 中文标题生成的 id 摘要退化为 `note`，唯一性由时间戳与序号保证
- 检索为大小写不敏感的子串匹配，不支持同义词
- 未做 1000 条以上笔记的性能压测

## 升级与回滚

- 升级：直接替换 `notes_cli` 目录，笔记数据格式向后兼容
- 回滚：恢复上一版本代码目录，执行 `notes index` 重建索引即可
"""

