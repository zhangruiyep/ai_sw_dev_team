path = "tests/test_notes_cli.py"
content = '''"""离线演练示例测试：仅使用标准库 unittest。"""

from __future__ import annotations

import json
import sys
import tempfile
import unittest
from pathlib import Path

sys.path.insert(0, str(Path(__file__).resolve().parents[1] / "src"))

import notes_cli  # noqa: E402


class NotesCliTest(unittest.TestCase):
    def setUp(self) -> None:
        self.tmp = tempfile.TemporaryDirectory()
        self.dir = Path(self.tmp.name)

    def tearDown(self) -> None:
        self.tmp.cleanup()

    def test_create_note_writes_file(self) -> None:
        note = notes_cli.write_note(self.dir, "离线演练", "验证写入", ["demo"])
        self.assertTrue((self.dir / f"{note['id']}.md").is_file())
        self.assertEqual(note["title"], "离线演练")

    def test_duplicate_title_gets_new_id(self) -> None:
        first = notes_cli.write_note(self.dir, "标题", "a", [])
        second = notes_cli.write_note(self.dir, "标题", "b", [])
        self.assertNotEqual(first["id"], second["id"])
        self.assertEqual(len(notes_cli.load_notes(self.dir)), 2)

    def test_keyword_search_finds_body(self) -> None:
        notes_cli.write_note(self.dir, "标题", "正文里有关键词", [])
        notes = notes_cli.load_notes(self.dir)
        self.assertTrue(any(notes_cli.matches(note, "关键词") for note in notes))

    def test_tag_filter_requires_all_tags(self) -> None:
        notes_cli.write_note(self.dir, "A", "", ["x", "y"])
        notes_cli.write_note(self.dir, "B", "", ["x"])
        notes = notes_cli.load_notes(self.dir)
        filtered = [note for note in notes if all(tag in note["tags"] for tag in ["x", "y"])]
        self.assertEqual(len(filtered), 1)

    def test_rebuild_index(self) -> None:
        notes_cli.write_note(self.dir, "A", "", ["demo"])
        index = notes_cli.rebuild_index(self.dir)
        self.assertEqual(len(index["notes"]), 1)
        data = json.loads((self.dir / "index.json").read_text(encoding="utf-8"))
        self.assertEqual(data["version"], 1)

    def test_delete_missing_note_returns_3(self) -> None:
        self.assertEqual(notes_cli.main(["--notes-dir", str(self.dir), "delete", "--id", "missing"]), 3)

    def test_json_mode_stdout_is_json(self) -> None:
        code = notes_cli.main(["--notes-dir", str(self.dir), "--json", "add", "--title", "JSON", "--body", "ok"])
        self.assertEqual(code, 0)

    def test_list_empty(self) -> None:
        self.assertEqual(notes_cli.main(["--notes-dir", str(self.dir), "list"]), 0)


if __name__ == "__main__":
    unittest.main()
'''
