[[artifacts]]
path = "src/notes_cli.py"
content = '''#!/usr/bin/env python3
"""notes_cli：离线演练示例实现（仅标准库）。

用法：
    python notes_cli.py add --title "标题" --body "正文" --tags demo,test
    python notes_cli.py list
    python notes_cli.py search --keyword 标题
    python notes_cli.py delete --id 20261109100000-demo
    python notes_cli.py index
"""

from __future__ import annotations

import argparse
import json
import re
import sys
from datetime import datetime
from pathlib import Path

HEADER_END = "----"
INDEX_NAME = "index.json"


def slugify(title: str) -> str:
    slug = re.sub(r"[^0-9A-Za-z]+", "-", title).strip("-").lower()
    return slug[:24] or "note"


def parse_note(path: Path) -> dict:
    text = path.read_text(encoding="utf-8")
    head, _, body = text.partition(HEADER_END + chr(10))
    meta: dict = {"id": path.stem, "tags": [], "title": path.stem, "created": ""}
    for line in head.splitlines():
        key, sep, value = line.partition(":")
        if not sep:
            continue
        key = key.strip().lower()
        if key == "tags":
            meta["tags"] = [tag.strip() for tag in value.split(",") if tag.strip()]
        elif key in ("title", "created"):
            meta[key] = value.strip()
    meta["body"] = body.strip()
    meta["path"] = str(path)
    return meta


def load_notes(notes_dir: Path) -> list[dict]:
    if not notes_dir.is_dir():
        return []
    return [parse_note(path) for path in sorted(notes_dir.glob("*.md"))]


def write_note(notes_dir: Path, title: str, body: str, tags: list[str], now: datetime | None = None) -> dict:
    notes_dir.mkdir(parents=True, exist_ok=True)
    now = now or datetime.now()
    base = f"{now:%Y%m%d%H%M%S}-{slugify(title)}"
    candidate, suffix = base, 1
    while (notes_dir / f"{candidate}.md").exists():
        suffix += 1
        candidate = f"{base}-{suffix}"
    content = chr(10).join(
        [
            f"title: {title}",
            f"tags: {', '.join(tags)}",
            f"created: {now.isoformat(timespec='seconds')}",
            HEADER_END,
            body,
            "",
        ]
    )
    path = notes_dir / f"{candidate}.md"
    path.write_text(content, encoding="utf-8")
    return parse_note(path)


def matches(note: dict, keyword: str) -> bool:
    needle = keyword.lower()
    return needle in note["title"].lower() or needle in note["body"].lower()


def summarize(note: dict, keyword: str) -> str:
    for line in note["body"].splitlines():
        if keyword.lower() in line.lower():
            return line[:80]
    return note["body"][:80]


def rebuild_index(notes_dir: Path) -> dict:
    notes = load_notes(notes_dir)
    index = {
        "version": 1,
        "generated_at": datetime.now().isoformat(timespec="seconds"),
        "notes": [
            {"id": note["id"], "title": note["title"], "tags": note["tags"], "created": note["created"]}
            for note in notes
        ],
    }
    notes_dir.mkdir(parents=True, exist_ok=True)
    (notes_dir / INDEX_NAME).write_text(json.dumps(index, ensure_ascii=False, indent=2), encoding="utf-8")
    return index


def emit(payload: dict, as_json: bool) -> None:
    if as_json:
        print(json.dumps(payload, ensure_ascii=False, indent=2))
        return
    for note in payload.get("notes", []):
        print(f"{note['id']}  {note['title']}  [{', '.join(note['tags'])}]")
    if payload.get("message"):
        print(payload["message"])


def build_parser() -> argparse.ArgumentParser:
    parser = argparse.ArgumentParser(prog="notes", description="本地 Markdown 笔记管理（离线演练示例）")
    parser.add_argument("--notes-dir", default="notes", help="笔记目录，默认 ./notes")
    parser.add_argument("--json", action="store_true", help="以 JSON 输出结果")
    sub = parser.add_subparsers(dest="command", required=True)

    add = sub.add_parser("add", help="新建笔记")
    add.add_argument("--title", required=True)
    add.add_argument("--body", default="")
    add.add_argument("--tags", default="")

    sub.add_parser("list", help="列出笔记")
    sub.add_parser("index", help="重建索引")

    search = sub.add_parser("search", help="检索笔记")
    search.add_argument("--keyword", default="")
    search.add_argument("--tag", action="append", default=[])

    delete = sub.add_parser("delete", help="删除笔记")
    delete.add_argument("--id", required=True)
    return parser


def main(argv: list[str] | None = None) -> int:
    args = build_parser().parse_args(argv)
    notes_dir = Path(args.notes_dir)
    if args.command == "add":
        tags = [tag.strip() for tag in args.tags.split(",") if tag.strip()]
        note = write_note(notes_dir, args.title, args.body, tags)
        emit({"notes": [note], "message": f"已创建 {note['id']}"}, args.json)
        return 0
    if args.command == "list":
        emit({"notes": load_notes(notes_dir)}, args.json)
        return 0
    if args.command == "index":
        index = rebuild_index(notes_dir)
        emit({"message": f"已重建索引，共 {len(index['notes'])} 条"}, args.json)
        return 0
    if args.command == "search":
        notes = load_notes(notes_dir)
        hits = [note for note in notes if args.keyword and matches(note, args.keyword)]
        hits = [note for note in hits if all(tag in note["tags"] for tag in args.tag)]
        for note in hits:
            note["summary"] = summarize(note, args.keyword) if args.keyword else note["body"][:80]
        emit({"notes": hits}, args.json)
        return 0
    if args.command == "delete":
        path = notes_dir / f"{args.id}.md"
        if not path.is_file():
            print(f"笔记不存在：{args.id}", file=sys.stderr)
            return 3
        path.unlink()
        emit({"message": f"已删除 {args.id}"}, args.json)
        return 0
    return 2


if __name__ == "__main__":
    raise SystemExit(main())
'''

