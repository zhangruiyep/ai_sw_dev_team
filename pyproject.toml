[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_sw_dev_team"
version = "0.1.0"
description = "本地可运行的多智能体协作框架：需求分析 / 架构方案 / 软件开发 / 质量控制 / 交付版本管理"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai_sw_dev_team = "ai_sw_dev_team.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
